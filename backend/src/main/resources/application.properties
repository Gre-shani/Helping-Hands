spring.application.name=helping-hands-backend

# Use port 8081 to avoid the "Port already in use" error
server.port=8081

# Database Connection using the password we just found
spring.datasource.url=jdbc:mysql://localhost:3306/helping_hands_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=12345

# Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Security
spring.security.user.name=admin
spring.security.user.password=password

# Turn off security for all endpoints
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration